<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Registration Form</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial, sans-serif;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;

        }

        .container{

            width:450px;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);

        }

        h2{

            text-align:center;
            margin-bottom:30px;
            font-size:38px;

        }

        input{

            width:100%;
            padding:15px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:17px;

        }

        button{

            width:100%;
            padding:15px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;

        }

        button:hover{

            background:#0056b3;

        }

    </style>

</head>

<body>

<div class="container">

    <h2>Registration Form</h2>

    <form th:action="@{/register}" method="post">

        <input
                type="text"
                name="name"
                placeholder="Enter Name"
                required>

        <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required>

        <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>

</html>
